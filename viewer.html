<!DOCTYPE html>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      overflow: hidden;
    }
    .layout {
      display: flex;
      height: 100vh;
    }

    /* --- Sidebar --- */
    .sidebar {
      width: 280px;
      background: #1a1a2e;
      border-right: 1px solid #333;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: margin-left 0.2s;
    }
    .sidebar.collapsed {
      margin-left: -280px;
    }
    .sidebar-header {
      padding: 1rem;
      border-bottom: 1px solid #333;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .sidebar-header h1 {
      font-size: 1rem;
      color: #7fdbca;
    }
    .sidebar-toc {
      flex: 1;
      overflow-y: auto;
      padding: 0.5rem 0;
    }
    .sidebar-toc::-webkit-scrollbar { width: 6px; }
    .sidebar-toc::-webkit-scrollbar-track { background: transparent; }
    .sidebar-toc::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    .unit-group summary {
      font-size: 0.8rem;
      font-weight: 600;
      color: #7fdbca;
      padding: 0.5rem 1rem 0.3rem;
      cursor: pointer;
      user-select: none;
      list-style: none;
    }
    .unit-group summary::before {
      content: "\25B6\00a0";
      font-size: 0.6rem;
      vertical-align: middle;
    }
    .unit-group[open] summary::before {
      content: "\25BC\00a0";
    }
    .unit-group ul { list-style: none; padding: 0 0 0.3rem 0; }
    .unit-group li { margin: 0; }
    .unit-group a {
      display: block;
      padding: 0.3rem 1rem 0.3rem 1.5rem;
      color: #bbb;
      text-decoration: none;
      font-size: 0.8rem;
      line-height: 1.4;
      border-left: 3px solid transparent;
      transition: background 0.15s, border-color 0.15s;
    }
    .unit-group a:hover {
      background: #16213e;
      color: #eee;
    }
    .unit-group a.active {
      background: #16213e;
      color: #7fdbca;
      border-left-color: #7fdbca;
      font-weight: 600;
    }

    /* --- Main viewer area --- */
    .viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Top bar */
    .topbar {
      background: #16213e;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
      padding: 0.4rem 1rem;
      gap: 0.75rem;
      flex-shrink: 0;
    }
    .topbar button {
      background: none;
      border: 1px solid #555;
      color: #ccc;
      border-radius: 4px;
      padding: 0.3rem 0.7rem;
      cursor: pointer;
      font-size: 0.85rem;
      transition: background 0.15s;
    }
    .topbar button:hover { background: #333; color: #fff; }
    .topbar button:disabled { opacity: 0.3; cursor: default; }
    .topbar .title {
      flex: 1;
      font-size: 0.85rem;
      color: #eee;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .topbar .counter {
      font-size: 0.8rem;
      color: #888;
      white-space: nowrap;
    }
    .topbar .toggle-sidebar {
      font-size: 1.1rem;
      padding: 0.2rem 0.5rem;
    }

    /* Iframe */
    .lesson-frame {
      flex: 1;
      border: none;
      background: #fff;
    }

    /* Keyboard hint */
    .hint {
      background: #16213e;
      border-top: 1px solid #333;
      padding: 0.3rem 1rem;
      font-size: 0.75rem;
      color: #666;
      text-align: center;
      flex-shrink: 0;
    }
    .hint kbd {
      background: #333;
      border: 1px solid #555;
      border-radius: 3px;
      padding: 0.1rem 0.4rem;
      font-family: inherit;
      font-size: 0.7rem;
      color: #aaa;
    }
  </style>
</head>

// Flatten to ordered list
const allLessons = [];
units.forEach((unit, ui) => {
  unit.lessons.forEach((lesson, li) => {
    allLessons.push({ ...lesson, unitIndex: ui, lessonIndex: li });
  });
});

let currentIndex = 0;

// --- Build sidebar TOC ---
const tocEl = document.getElementById('toc');
units.forEach((unit, ui) => {
  const details = document.createElement('details');
  details.className = 'unit-group';
  if (ui === 0) details.open = true;
  const summary = document.createElement('summary');
  summary.textContent = unit.name;
  details.appendChild(summary);
  const ul = document.createElement('ul');
  unit.lessons.forEach((lesson, li) => {
    const flatIdx = allLessons.findIndex(l => l.href === lesson.href);
    const a = document.createElement('a');
    a.href = '#';
    a.textContent = lesson.title;
    a.dataset.index = flatIdx;
    a.addEventListener('click', (e) => {
      e.preventDefault();
      navigateTo(flatIdx);
    });
    const liEl = document.createElement('li');
    liEl.appendChild(a);
    ul.appendChild(liEl);
  });
  details.appendChild(ul);
  tocEl.appendChild(details);
});

const titleEl = document.getElementById('lessonTitle');
const counterEl = document.getElementById('counter');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');

function navigateTo(index) {
  if (index < 0 || index >= allLessons.length) return;
  currentIndex = index;
  const lesson = allLessons[index];

  frame.src = lesson.href;
  titleEl.textContent = lesson.title;
  counterEl.textContent = `${index + 1} / ${allLessons.length}`;
  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === allLessons.length - 1;

  // Update active state in sidebar
  tocEl.querySelectorAll('a.active').forEach(a => a.classList.remove('active'));
  const activeLink = tocEl.querySelector(`a[data-index="${index}"]`);
  if (activeLink) {
    activeLink.classList.add('active');
    // Open parent details
    const details = activeLink.closest('details');
    if (details) details.open = true;
    // Scroll into view
    activeLink.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

  // Save position
  try { sessionStorage.setItem('cs160-viewer-pos', index); } catch(e) {}
}

prevBtn.addEventListener('click', () => navigateTo(currentIndex - 1));
nextBtn.addEventListener('click', () => navigateTo(currentIndex + 1));

document.getElementById('toggleSidebar').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});

// --- Keyboard navigation ---
function handleNav(e) {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

  switch (e.key) {
    case 'ArrowLeft':
      e.preventDefault();
      navigateTo(currentIndex - 1);
      break;
    case 'ArrowRight':
      e.preventDefault();
      navigateTo(currentIndex + 1);
      break;
    case 'Home':
      e.preventDefault();
      navigateTo(0);
      break;
    case 'End':
      e.preventDefault();
      navigateTo(allLessons.length - 1);
      break;
    case 's':
    case 'S':
      if (!e.ctrlKey && !e.metaKey) {
        e.preventDefault();
        document.getElementById('sidebar').classList.toggle('collapsed');
      }
      break;
  }
}

document.addEventListener('keydown', handleNav);

// Re-attach keyboard listener inside iframe after each load,
// so arrow keys still work even when the iframe has focus.
frame.addEventListener('load', () => {
  try {
    const iframeDoc = frame.contentDocument || frame.contentWindow.document;
    iframeDoc.addEventListener('keydown', handleNav);
  } catch (e) {
    // cross-origin iframe — can't attach, keys won't forward
  }
});

// --- Restore position or start at first lesson ---
let startPos = 0;
try {
  const saved = sessionStorage.getItem('cs160-viewer-pos');
  if (saved !== null) startPos = parseInt(saved, 10);
} catch(e) {}
navigateTo(startPos);
</script>
</body>
</html>
