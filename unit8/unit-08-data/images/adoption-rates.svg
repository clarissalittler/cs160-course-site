<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
<title id="title">Adoption rate by breed group in the practice dataset</title>
<desc id="desc">Herding 61.0 percent, Terrier 54.3 percent, Working 47.3 percent, Toy 23.7 percent. Rates are adopted dogs divided by available dogs.</desc>
<rect width="760" height="300" fill="white"/>
<g font-family="sans-serif" font-size="17" fill="#222"><text x="380" y="30" text-anchor="middle" font-size="21">Adoption rate by breed group</text>
<text x="135" y="81" text-anchor="end">Herding</text><rect x="150" y="60" width="304.878" height="30" fill="#226184"/><text x="464.878" y="81">61.0%</text><text x="135" y="126" text-anchor="end">Terrier</text><rect x="150" y="105" width="271.277" height="30" fill="#226184"/><text x="431.277" y="126">54.3%</text><text x="135" y="171" text-anchor="end">Working</text><rect x="150" y="150" width="236.559" height="30" fill="#226184"/><text x="396.559" y="171">47.3%</text><text x="135" y="216" text-anchor="end">Toy</text><rect x="150" y="195" width="118.644" height="30" fill="#226184"/><text x="278.644" y="216">23.7%</text><line x1="150" y1="50" x2="150" y2="235" stroke="#333"/><line x1="150" y1="235" x2="650" y2="235" stroke="#333"/>
<line x1="150" y1="235" x2="150" y2="240" stroke="#333"/><text x="150" y="260" text-anchor="middle">0</text><line x1="250" y1="235" x2="250" y2="240" stroke="#333"/><text x="250" y="260" text-anchor="middle">20</text><line x1="350" y1="235" x2="350" y2="240" stroke="#333"/><text x="350" y="260" text-anchor="middle">40</text><line x1="450" y1="235" x2="450" y2="240" stroke="#333"/><text x="450" y="260" text-anchor="middle">60</text><line x1="550" y1="235" x2="550" y2="240" stroke="#333"/><text x="550" y="260" text-anchor="middle">80</text><line x1="650" y1="235" x2="650" y2="240" stroke="#333"/><text x="650" y="260" text-anchor="middle">100</text><text x="400" y="290" text-anchor="middle">Adoption rate (%)</text></g></svg>
