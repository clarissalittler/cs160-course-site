<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backpropagation Playground</title>
<style>
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         margin: 0; padding: 14px; color: #222; background: #fff; }
  canvas { width: 100%; height: auto; max-width: 460px; display: block; margin: 0 auto;
           border: 1px solid #ddd; border-radius: 6px; background: #fafafa; }
  .controls { max-width: 640px; margin: 12px auto 0; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin: 10px 0; }
  .row label { min-width: 90px; font-weight: 600; }
  input[type=range] { flex: 1 1 180px; }
  .buttons { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button { font-size: 0.95rem; padding: 8px 14px; border: 1px solid #1c507e; background: #1c507e;
           color: #fff; border-radius: 6px; cursor: pointer; }
  button.ghost { background: #fff; color: #1c507e; }
  button:focus-visible { outline: 3px solid #f1c40f; }
  .readout { background: #f3f7fb; border-left: 4px solid #1c507e; padding: 10px 12px;
             border-radius: 0 6px 6px 0; margin-top: 12px; font-size: 0.95rem; }
  .readout b { color: #1c507e; }
  .legend { text-align:center; font-size: 0.82rem; color:#666; margin-top:6px; }
  .sw { display:inline-block; width:22px; height:8px; border-radius:4px; vertical-align:middle; }
</style>
</head>
<body>

<canvas id="net" width="460" height="300" role="img" aria-label="A small neural network: one input, two hidden neurons, one output, with weights on the connections."></canvas>
<div class="legend">Thicker, redder arrows during a round = more <b>blame</b> assigned to that knob.</div>

<div class="controls">
  <div class="row">
    <label for="target">Target</label>
    <input id="target" type="range" min="2" max="14" step="1" value="8" aria-label="The output we want the network to produce">
    <span id="tval" style="min-width:2.5em; text-align:right;">8</span>
  </div>
  <div class="row buttons">
    <button id="round">Learn one round</button>
    <button id="run" class="ghost">Run</button>
    <button id="reset" class="ghost">Reset knobs</button>
  </div>
  <div class="readout" id="readout" aria-live="polite"></div>
</div>

<script>
(function () {
  var X = 1;                 // the single input
  var target = 8;
  var w = [1, 1, 2, 1];      // w0:in->h1, w1:in->h2, w2:h1->out, w3:h2->out
  var blame = [0, 0, 0, 0];  // how much each weight is to blame (its gradient)
  var showBlame = false, round = 0, running = false, timer = null;
  var LR = 0.04;

  function forward() {
    var h1 = w[0] * X, h2 = w[1] * X;
    var out = w[2] * h1 + w[3] * h2;
    return { h1: h1, h2: h2, out: out };
  }
  function computeBlame(f) {
    var e = f.out - target;              // the error
    // ripple the blame backward (these are the gradients):
    blame[2] = 2 * e * f.h1;             // h1 -> out
    blame[3] = 2 * e * f.h2;             // h2 -> out
    blame[0] = 2 * e * w[2] * X;         // in -> h1  (blame passed back through w2)
    blame[1] = 2 * e * w[3] * X;         // in -> h2  (blame passed back through w3)
    return e;
  }

  // node pixel positions (in the 460x300 canvas)
  var IN = { x: 70, y: 150 }, H1 = { x: 230, y: 80 }, H2 = { x: 230, y: 220 }, OUT = { x: 390, y: 150 };
  var ctx = document.getElementById('net').getContext('2d');

  function edge(a, b, wi, idx) {
    var mag = Math.min(Math.abs(blame[idx]) / 12, 1);     // 0..1
    ctx.strokeStyle = showBlame ? 'rgba(192,57,43,' + (0.25 + 0.75 * mag) + ')' : '#9bb4cd';
    ctx.lineWidth = showBlame ? (1.5 + 5 * mag) : 2.5;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    // label: weight, or blame during a round
    var mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2 - 6;
    ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    if (showBlame) {
      ctx.fillStyle = '#c0392b';
      ctx.fillText('blame ' + blame[idx].toFixed(1), mx, my);
    } else {
      ctx.fillStyle = '#1c507e';
      ctx.fillText('knob ' + wi.toFixed(2), mx, my);
    }
  }
  function node(p, label, val, glow) {
    ctx.beginPath(); ctx.arc(p.x, p.y, 24, 0, 2 * Math.PI);
    ctx.fillStyle = glow ? '#d6e4f0' : '#fff';
    ctx.fill(); ctx.lineWidth = 2; ctx.strokeStyle = '#1c507e'; ctx.stroke();
    ctx.fillStyle = '#1c507e'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(label, p.x, p.y - 2);
    ctx.font = '11px sans-serif'; ctx.fillStyle = '#444';
    ctx.fillText(val, p.x, p.y + 12);
  }

  function draw() {
    var f = forward();
    ctx.clearRect(0, 0, 460, 300);
    edge(IN, H1, w[0], 0); edge(IN, H2, w[1], 1);
    edge(H1, OUT, w[2], 2); edge(H2, OUT, w[3], 3);
    node(IN, 'input', X.toFixed(0), false);
    node(H1, 'hidden', f.h1.toFixed(1), false);
    node(H2, 'hidden', f.h2.toFixed(1), false);
    node(OUT, 'output', f.out.toFixed(1), showBlame);
    // target flag at output
    ctx.fillStyle = '#2e7d32'; ctx.font = '12px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('want ' + target, OUT.x, OUT.y + 44);
    readout(f);
  }

  function readout(f) {
    var e = f.out - target;
    var msg = 'Round <b>' + round + '</b>. The network output <b>' + f.out.toFixed(1) +
              '</b> but we wanted <b>' + target + '</b> &mdash; off by <b>' + e.toFixed(1) + '</b>.';
    if (showBlame) {
      msg += ' Blame just rippled backward to every knob; the redder the arrow, the bigger that knob’s nudge.';
    } else if (round > 0) {
      msg += ' The knobs were nudged; press again and watch the error shrink.';
    } else {
      msg += ' Press <b>Learn one round</b> to assign blame and nudge the knobs.';
    }
    if (Math.abs(e) < 0.1) msg = 'Round <b>' + round + '</b>. Output <b>' + f.out.toFixed(1) +
      '</b> matches the target <b>' + target + '</b> &mdash; <b style="color:#2e7d32">learned it!</b>';
    document.getElementById('readout').innerHTML = msg;
    // keep the canvas description accurate to the current state for anyone exploring by element
    document.getElementById('net').setAttribute('aria-label',
      'Neural network diagram: one input, two hidden neurons, one output. Round ' + round +
      '. Current output ' + f.out.toFixed(1) + ', target ' + target + ', off by ' + e.toFixed(1) + '.' +
      (showBlame ? ' Blame values are rippling backward to the connection weights.' : ''));
  }

  function step() {
    for (var i = 0; i < 4; i++) w[i] -= LR * blame[i];
  }

  function learnRound(after) {
    var f = forward();
    computeBlame(f);
    showBlame = true; round++; draw();            // show the blame flowing back
    setTimeout(function () {
      step(); showBlame = false; draw();           // then nudge the knobs and settle
      if (after) after();
    }, 650);
  }

  function stopRun() { running = false; clearTimeout(timer); document.getElementById('run').textContent = 'Run'; }
  function toggleRun() {
    if (running) { stopRun(); return; }
    running = true; document.getElementById('run').textContent = 'Stop';
    (function loop() {
      if (!running) return;
      var f = forward();
      if (Math.abs(f.out - target) < 0.1 || round > 200) { stopRun(); return; }
      learnRound(function () { timer = setTimeout(loop, 350); });
    })();
  }

  document.getElementById('target').addEventListener('input', function (e) {
    stopRun(); target = +e.target.value; document.getElementById('tval').textContent = target;
    showBlame = false; draw();
  });
  document.getElementById('round').addEventListener('click', function () { stopRun(); learnRound(null); });
  document.getElementById('run').addEventListener('click', toggleRun);
  document.getElementById('reset').addEventListener('click', function () {
    stopRun(); w = [1, 1, 2, 1]; blame = [0, 0, 0, 0]; round = 0; showBlame = false; draw();
  });

  draw();
})();
</script>
</body>
</html>
